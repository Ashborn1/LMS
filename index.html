<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div id="auth">
  <div class="card login-card">
    <div class="login-icon">📚</div>
    <h2>Library Admin</h2>
    <p class="sub-text">Sign in to manage the catalog</p>
    <input id="user" placeholder="Username (admin)">
    <input id="pass" type="password" placeholder="Password (admin123)">
    <button id="loginBtn">Sign in</button>
    <p id="loginErr" class="err"></p>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header>
    <div class="logo-area">
      <span class="logo-icon">📚</span>
      <h1>Library Management</h1>
    </div>
    <div class="user-area">
      <span id="who"></span>
      <button id="logout" class="ghost danger">Log out</button>
    </div>
  </header>

  <main>
    <!-- Filter / Search bar -->
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="search" placeholder="Search by title or category…">
      </div>
      <select id="catFilter">
        <option value="all">All Categories</option>
        <option value="IT">IT</option>
        <option value="Science">Science</option>
        <option value="English">English</option>
        <option value="Social Studies">Social Studies</option>
      </select>
      <select id="sortBy">
        <option value="title-asc">Title (A–Z)</option>
        <option value="title-desc">Title (Z–A)</option>
        <option value="avail-desc">Most Available</option>
        <option value="avail-asc">Least Available</option>
      </select>
      <select id="availFilter">
        <option value="all">All Books</option>
        <option value="available">Available Only</option>
        <option value="out">Fully Borrowed</option>
      </select>
    </div>

    <div id="books" class="grid"></div>
    <p id="noResults" class="no-results" hidden>No books match your search.</p>

    <div class="section-head">
      <h2>Library Records</h2>
      <div class="tabs">
        <button id="tabActive" class="tab-btn active" onclick="switchTab('active')">Active Loans</button>
        <button id="tabHistory" class="tab-btn" onclick="switchTab('history')">Borrow History</button>
      </div>
    </div>
    
    <div class="table-wrap">
      <table id="loansTable">
        <thead id="tableHead"></thead>
        <tbody id="loansBody"></tbody>
      </table>
      <p id="noLoans" class="no-results" style="padding: 32px; margin: 0;"></p>
    </div>
  </main>
</div>

<!-- BORROW MODAL -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3>Borrow Book</h3>
      <p class="modal-sub" id="modalBookName"></p>
    </div>

    <div class="form-grid">
      <div class="field">
        <label>Full name *</label>
        <input id="fName" placeholder="Juan Dela Cruz">
      </div>

      <div class="field">
        <label>Borrower type *</label>
        <select id="fType">
          <option value="Student">Student</option>
          <option value="Faculty">Faculty</option>
          <option value="Staff">Staff</option>
          <option value="Guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label>Student / ID number *</label>
        <input id="fStudentId" placeholder="e.g. 202400123" inputmode="numeric">
      </div>

      <div class="field">
        <label>Section / Department</label>
        <input id="fSection" placeholder="e.g. BSIT 2-A">
      </div>

      <div class="field">
        <label>Gender</label>
        <select id="fGender">
          <option value="">Prefer not to say</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label>Contact / Email</label>
        <input id="fContact" placeholder="Optional">
      </div>

      <div class="field full">
        <label>Due date *</label>
        <input id="dueDate" type="date">
      </div>

      <div class="field full">
        <label>Notes (Optional)</label>
        <input id="fNotes" placeholder="E.g., Group project, reference book...">
      </div>
    </div>

    <p id="modalErr" class="err"></p>

    <div class="modal-actions">
      <button id="cancelBorrow" class="ghost">Cancel</button>
      <button id="confirmBorrow">Confirm Borrow</button>
    </div>
  </div>
</div>

<!-- EXTEND MODAL -->
<div id="extendModal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3>Extend Due Date</h3>
      <p class="modal-sub" id="extendBookName"></p>
    </div>

    <div class="form-grid">
      <div class="field full">
        <label>Current Due Date</label>
        <input id="extendCurrentDue" type="text" disabled style="background:#e2e8f0; color:#64748b; cursor:not-allowed;">
      </div>
      
      <div class="field full">
        <label>New Due Date *</label>
        <input id="extendNewDue" type="date">
      </div>

      <div class="field full">
        <label>Reason for extension *</label>
        <input id="extendReason" placeholder="E.g., Still working on research...">
      </div>
    </div>

    <p id="extendErr" class="err"></p>

    <div class="modal-actions">
      <button id="cancelExtend" class="ghost">Cancel</button>
      <button id="confirmExtend">Confirm Extension</button>
    </div>
  </div>
</div>

<!-- VIEW DETAILS MODAL -->
<div id="viewModal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3>Loan Details</h3>
      <p class="modal-sub" id="viewBookName"></p>
    </div>
    
    <div class="detail-grid">
      <div class="detail-row">
        <span class="detail-label">Borrower Name</span>
        <span id="vName" class="detail-val"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Borrower Type</span>
        <span id="vType" class="detail-val"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Student / ID No.</span>
        <span id="vStudentId" class="detail-val"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Section / Dept</span>
        <span id="vSection" class="detail-val"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Contact / Email</span>
        <span id="vContact" class="detail-val"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Current Due Date</span>
        <span id="vDueDate" class="detail-val" style="color: #4f46e5; font-weight: 800;"></span>
      </div>
      <div class="detail-row" id="vReturnDateRow" style="display: none;">
        <span class="detail-label">Date Returned</span>
        <span id="vReturnDate" class="detail-val" style="color: #10b981; font-weight: 800;"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Notes</span>
        <span id="vNotes" class="detail-val" style="font-style: italic; font-weight: 400;"></span>
      </div>
    </div>

    <!-- Extension History -->
    <div id="vExtensionArea" style="display: none; margin-top: 16px;">
      <h4 style="margin: 0 0 8px; font-size: 14px; color: #475569;">Extension History</h4>
      <div id="vExtensionList" style="background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 13px; display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <div class="modal-actions">
      <button id="closeView" class="ghost">Close</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
