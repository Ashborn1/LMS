<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library (Simple)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div id="auth">
  <div class="card">
    <h2>📚 Library Login</h2>
    <input id="user" placeholder="Username (admin)">
    <input id="pass" type="password" placeholder="Password (admin123)">
    <button id="loginBtn">Sign in</button>
    <p id="loginErr" class="err"></p>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header>
    <h1>📚 Library Management System</h1>
    <div>
      <span id="who"></span>
      <button id="logout">Log out</button>
    </div>
  </header>

  <main>
    <!-- Filter / Search bar -->
    <div class="toolbar">
      <input id="search" placeholder="🔍 Search title or category…">
      <select id="catFilter">
        <option value="all">All Categories</option>
        <option value="IT">IT</option>
        <option value="Science">Science</option>
        <option value="English">English</option>
        <option value="Social Studies">Social Studies</option>
      </select>
      <select id="sortBy">
        <option value="title-asc">Title (A–Z)</option>
        <option value="title-desc">Title (Z–A)</option>
        <option value="avail-desc">Most Available</option>
        <option value="avail-asc">Least Available</option>
      </select>
      <select id="availFilter">
        <option value="all">All Books</option>
        <option value="available">Available Only</option>
        <option value="out">Fully Borrowed</option>
      </select>
    </div>

    <div id="books" class="grid"></div>
    <p id="noResults" class="no-results" hidden>No books match your search.</p>

    <h2>Active Loans</h2>
    <table id="loansTable">
      <thead><tr><th>Book</th><th>Borrower</th><th>Due</th><th></th></tr></thead>
      <tbody id="loansBody"></tbody>
    </table>
    <p id="noLoans">No active loans.</p>
  </main>
</div>

<!-- BORROW MODAL -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3>Borrow Book</h3>
    <input id="borrowerName" placeholder="Borrower name">
    <input id="dueDate" type="date">
    <p id="modalErr" class="err"></p>
    <div>
      <button id="cancelBorrow">Cancel</button>
      <button id="confirmBorrow">Confirm</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
