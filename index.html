<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library (Simple)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div id="auth">
  <div class="card">
    <h2>📚 Library Login</h2>
    <input id="user" placeholder="Username (admin)">
    <input id="pass" type="password" placeholder="Password (admin123)">
    <button id="loginBtn">Sign in</button>
    <p id="loginErr" class="err"></p>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header>
    <h1>📚 Library</h1>
    <div>
      <span id="who"></span>
      <button id="logout">Log out</button>
    </div>
  </header>

  <main>
    <div id="books" class="grid"></div>

    <h2>Active Loans</h2>
    <table id="loansTable">
      <thead><tr><th>Book</th><th>Borrower</th><th>Due</th><th></th></tr></thead>
      <tbody id="loansBody"></tbody>
    </table>
    <p id="noLoans">No active loans.</p>
  </main>
</div>

<!-- BORROW MODAL -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3>Borrow Book</h3>
    <input id="borrowerName" placeholder="Borrower name">
    <input id="dueDate" type="date">
    <p id="modalErr" class="err"></p>
    <div>
      <button id="cancelBorrow">Cancel</button>
      <button id="confirmBorrow">Confirm</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
